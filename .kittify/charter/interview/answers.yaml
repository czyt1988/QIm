schema_version: "1.0.0"
mission: "software-dev"
profile: "comprehensive"
answers:
  project_intent: >
    QIm is a C++17 library that wraps Dear ImGui, ImPlot, and ImPlot3D into
    Qt's retained-mode paradigm using QObject nodes and parent-child object
    trees. The primary governance goal is to enforce the strict coding
    conventions documented in AGENTS.md: Qt macro discipline (Q_SLOTS/Q_SIGNALS/Q_EMIT
    instead of slots/signals/emit), custom PIMPL pattern (std::unique_ptr with
    QIM_DECLARE_PRIVATE/QIM_DECLARE_PUBLIC/QIM_D/QIM_DC macros), bilingual
    comment rules (single-line English in headers, dual-language Doxygen in
    .cpp files, bilingual Doxygen for signals), rendering performance rules
    (beginDraw must be pure API calls with pre-prepared data, no conversions
    or conditionals per frame), enum semantic conversion rules (2D negation
    to Qt affirmation with flag macros, 3D direct mapping), DLL export
    boundary discipline (QIM_CORE_API/QIM_WIDGETS_API), and color delayed
    initialization (QImOptionalColor pattern).
  languages_frameworks: >
    C++17, Qt 5.14+ and Qt 6 (Core, Gui, Widgets, OpenGL, OpenGLWidgets for Qt6),
    CMake (Visual Studio generator required on Windows, not Ninja), Dear ImGui,
    ImPlot, ImPlot3D, qtimgui backend. Two DLL targets: QImCore and QImWidgets.
  testing_requirements: >
    Minimal unit testing. The test system deliberately avoids OpenGL dependency:
    tests/plot/ has 1 algorithm test (downsampler), tests/plot3d/ has 7 pure
    unit tests (enums, math_types, conversions, styles, colormaps, utilities,
    setup_api). No GUI or rendering tests exist by design. Functional verification
    is done through manual example runs (examples/qimfigure-test with TestFunction
    base class pattern). CI testing on Ubuntu requires QIM_BUILD_TESTS=ON and
    runs ctest with plot filter.
  quality_gates: >
    The strict coding conventions in AGENTS.md serve as the primary quality gates:
    Qt macro compliance, PIMPL pattern compliance, comment format compliance,
    rendering performance compliance (no data work in beginDraw), and enum
    semantic conversion correctness. AGENTS.md is the authoritative reference
    and is sufficient for quality enforcement.
  review_policy: >
    Not every change requires human review. Changes that follow established
    patterns (e.g., new plot node types using existing macros and conventions)
    may be approved without review. Risky or boundary-crossing changes should
    be reviewed.
  performance_targets: >
    The rendering performance rules in AGENTS.md are sufficient: beginDraw must
    be pure API calls with pre-prepared data, string storage as QByteArray UTF8
    not QString, QColor to ImVec4 conversion in setters not beginDraw, and
    per-frame SetNext* API calls must happen every frame. No additional
    quantitative targets required.
  deployment_constraints: >
    Windows requires Visual Studio generator (not Ninja due to MSVC environment
    issues in PowerShell). macOS requires OpenGL 3.3 Core Profile default format
    to avoid blank windows. Qt 6 needs OpenGLWidgets component. No branch
    protection rules or specific release process constraints specified.
  documentation_policy: >
    AGENTS.md documentation rules are sufficient and authoritative. Header files:
    single-line English // comments on public functions, no Doxygen blocks.
    Q_PROPERTY: no comments at all. Class comments: only @brief/@details/@note/@see,
    no @param/@class/@ingroup. Source files (.cpp): must have bilingual Doxygen
    with \if ENGLISH/\if CHINESE. Signals: must have bilingual Doxygen in headers
    (since signals have no .cpp definition). MkDocs + i18n plugin for bilingual
    site documentation, Doxygen for API docs generated by CI.
  risk_boundaries: >
    The 3rdparty/ directory containing imgui, implot, implot3d, and qtimgui
    sources must never be modified. The DLL export macros in src/QImAPI.h
    (QIM_CORE_API, QIM_WIDGETS_API, and the IMGUI_USER_CONFIG injection) must
    not be modified. The PIMPL macro definitions (QIM_DECLARE_PRIVATE,
    QIM_DECLARE_PUBLIC, QIM_PIMPL_CONSTRUCT, QIM_D, QIM_DC) must not be
    modified. These are foundational infrastructure that all other code depends
    on; changes here risk breaking the entire library's ABI or compilation.
  amendment_process: >
    The charter may be edited manually by the project maintainer. No formal
    review or approval process required for charter amendments.
  exception_policy: >
    No exception policy defined for now. Conventions should be followed strictly
    per AGENTS.md. If an exception is needed in the future, it should be
    documented explicitly in the charter or AGENTS.md.
