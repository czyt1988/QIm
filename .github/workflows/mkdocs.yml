name: MkDocs

on:
  push:
    branches: [master]
  workflow_dispatch:          # 手动触发按钮

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 让 git-revision-date 能读到历史

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      # Doxygen生成API文档到项目根目录的doxygen/和doxygen-en/（不在docs/内）
      # 这样mkdocs不会扫描到Doxygen生成的HTML文件，避免i18n插件编码错误
      - name: Build Doxygen API docs (Chinese)
        run: |
          cd docs/doxygen-doc-file
          sed -i 's|OUTPUT_DIRECTORY       = ../|OUTPUT_DIRECTORY       = ../../doxygen|' Doxyfile-wiki-cn
          doxygen Doxyfile-wiki-cn

      - name: Build Doxygen API docs (English)
        run: |
          cd docs/doxygen-doc-file
          echo 'OUTPUT_DIRECTORY = ../../doxygen-en' >> Doxyfile-wiki-en
          doxygen Doxyfile-wiki-en
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt   # 只装文档依赖，见下方

      - name: Build site
        run: mkdocs build --clean

      # 将Doxygen生成的API文档复制到MkDocs输出目录
      # 中文API文档 → site/doxygen/，英文API文档 → site/en/doxygen-en/
      # Doxygen输出结构：doxygen/doxygen/ 和 doxygen-en/doxygen-en/（OUTPUT_DIRECTORY + HTML_OUTPUT双层）
      - name: Copy Doxygen docs to site
        run: |
          cp -r doxygen/doxygen site/doxygen
          mkdir -p site/en
          cp -r doxygen-en/doxygen-en site/en/doxygen-en

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/          # MkDocs 默认输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4